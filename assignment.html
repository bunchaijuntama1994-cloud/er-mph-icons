  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #0B1F3A;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;

      color: white;
    }

    .container {
      width: 100%;
      max-width: 520px;

      display: flex;

      height: 180px;

    }

    }

      display: inline-block;

      background: white;
      color: #0B1F3A;

      border: none;
      border-radius: 18px;

      padding: 18px 38px;

      font-size: 20px;
      font-weight: 700;

      text-decoration: none;

      box-shadow: 0 8px 25px rgba(0,0,0,0.25);

      transition: 0.2s;
    }

    .open-btn:hover {
      transform: translateY(-2px);
    }

    .open-btn:active {
      transform: scale(0.97);
    }

    .note {
      margin-top: 25px;
      font-size: 13px;
      opacity: 0.75;
