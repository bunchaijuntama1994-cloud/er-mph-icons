  <style>

    * {

    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    body {
      background:
        linear-gradient(
          135deg,
          #0B1F3A 0%,
          #102E52 50%,
          #0B1F3A 100%
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      min-height: 100dvh;

    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 30px 20px;
    }

    .icon {
      width: 180px;
      height: 180px;

      object-fit: contain;

      border-radius: 38px;

      margin-bottom: 25px;

      filter:
        drop-shadow(0 10px 20px rgba(0,0,0,0.35));
    }

    h1 {
      margin: 0 0 12px;

      font-size: 30px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.7;

      margin-bottom: 28px;

      color: #e8eef7;
    }

    .open-btn {
      display: inline-block;

      padding: 16px 38px;

      background: white;
      color: #0B1F3A;

      text-decoration: none;

      border-radius: 16px;

      font-size: 18px;
      font-weight: 700;

      box-shadow:
        0 8px 20px rgba(0,0,0,0.25);

      transition: 0.2s;
    }

    .open-btn:hover {
      transform: translateY(-2px);
    }

    .open-btn:active {
      transform: scale(0.97);
    }

    .version {
      margin-top: 25px;

      font-size: 13px;

      color: rgba(255,255,255,0.65);
    }

  </style>
</head>

  <div class="container">

    <img
